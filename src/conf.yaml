#ASR_MODEL: "Faster-Whisper"
ASR_MODEL: "FunASR"

FunASR:
  # Model ids are hub-specific: the same model is "iic/SenseVoiceSmall" on
  # ModelScope and "FunAudioLLM/SenseVoiceSmall" on HuggingFace. Changing `hub`
  # below without changing these gives "model ... is not registered", which
  # does not sound like a naming problem and is one.
  model_name: "FunAudioLLM/SenseVoiceSmall"   # ms: iic/SenseVoiceSmall

  #vad_model: "fsmn-vad" # this is only used to make it works if audio is longer than 30s
  punc_model: "funasr/ct-punc"   # ms: ct-punc
  # "auto" picks cuda, then mps, then cpu. Leave it alone unless you have a
  # reason: naming a device here is wrong on every machine that does not have
  # it, and this file travels between them.
  #
  # It is not a tuning knob. Measured on an M4 over one 6.2s phrase (10
  # calls), dual-track real-time factor is 2.04 on cpu -- falling behind twice
  # over -- against 0.35 on mps. Landing on cpu by accident means
  # transcription that cannot keep up with the meeting.
  device: "auto"
  ncpu: 4 # number of threads for CPU internal operations (ignored on mps/cuda).
  # Where the models come from on a first run: "hf" (HuggingFace) or "ms"
  # (ModelScope).
  #
  # This was "ms", and it cost somebody an hour. The ModelScope site answers in
  # under a second, but its file downloads timed out over and over -- 213
  # retries, nothing written to disk -- and the client has no timeout, so the
  # app sat there retrying forever with no way to tell it apart from a hang.
  # HuggingFace served the same model immediately from the same machine.
  #
  # ModelScope is usually faster inside mainland China. If that is you, "ms" is
  # worth trying; if a first run then stalls, put it back.
  hub: "hf"
  use_itn: True
  # "auto", not a fixed language. SenseVoice detects zh/yue/en/ja/ko per
  # utterance, and pinning it mistranslates everything else: on a real
  # Cantonese call, language "en" turned 「哦，五三係嘛，請問你電話號碼幾多咧？」
  # into "o hi guess question." and 5.8s of speech into the single word
  # "some" -- the model forces the syllables onto English words.
  # Measured on that same audio, "auto" is also faster than pinning the
  # correct language (RTF 0.015 vs 0.025) and no less accurate.
  language: "auto" # zh, en, yue, ja, ko, auto

# ============================================================================
# LLM Configuration
# ============================================================================
# Supported providers: "openai" or "litellm"
# - openai: Uses OpenAI API (GPT-4, GPT-3.5)
# - litellm: Supports 100+ providers (Gemini, Ollama, Claude, etc.)
# ============================================================================

LLM:
  # Choose provider: "openai", "litellm" or "cli"
  provider: "openai"

  # ----------------------------------------------------------------------------
  # CLI Configuration -- answer through a locally installed agent CLI
  # ----------------------------------------------------------------------------
  # Bills against a subscription you may already pay for rather than per
  # token, so a long meeting costs nothing extra. The trade is latency: each
  # answer spawns a process, measured at 3.8-5.5s for `claude -p` against
  # roughly 1s for the same question over the API.
  #
  # Suited to the meeting-notes polish pass, where nobody is waiting. Not to
  # live interview prompting, where 4s plus transcription latency lands after
  # the moment has passed.
  #
  # The CLI must already be installed and logged in; there is no key to pass.
  cli:
    command: "claude"    # claude | codex | gemini
    # model: "opus"      # optional, passed as --model
    timeout: 90

  # ----------------------------------------------------------------------------
  # OpenAI Configuration
  # ----------------------------------------------------------------------------
  openai:
    model: "gpt-4o-mini"   # the default; the app's Model menu overrides it
    # API key is loaded from environment variable OPENAI_API_KEY

  # Offered in the app's Model menu. Edit this list rather than the code: model
  # names change faster than releases do, and a name baked into the source goes
  # stale the week after it ships. Anything valid for your provider works here.
  #
  # `echoai-helper config` puts an editable copy of this file where you can
  # reach it; the app reads that copy in preference to the shipped one.
  # A bare name goes to OpenAI. A name containing "/" is routed through
  # LiteLLM, which is how every non-OpenAI backend is reached -- so adding
  # Gemini, Ollama, Claude or anything else it supports means adding a line
  # here, not changing any code or adding a second menu.
  #
  # LiteLLM is an optional dependency: pip install "echoai-helper[litellm]".
  models:
    - "gpt-4o-mini"
    - "gpt-5.4-mini"
    - "gpt-5.6-luna"
    # - "gemini/gemini-2.0-flash"     # needs GEMINI_API_KEY
    # - "ollama/llama3"               # needs Ollama running locally, free
    # - "anthropic/claude-sonnet-4-5" # needs ANTHROPIC_API_KEY

  # ----------------------------------------------------------------------------
  # LiteLLM Configuration (supports multiple backends)
  # ----------------------------------------------------------------------------
  litellm:
    # Examples:

    # Google Gemini (Fast & Cheap)
    model: "gemini/gemini-1.5-flash"
    api_key: ""  # Set your Gemini API key here or use GEMINI_API_KEY env var

    # Google Gemini Pro (High Quality, 2M context)
    # model: "gemini/gemini-1.5-pro"
    # api_key: ""

    # Ollama - Local LLM (FREE, requires Ollama running)
    # model: "ollama/gemma2:2b"  # or llama3, qwen, etc.
    # api_base: "http://localhost:11434"

    # Claude (Anthropic)
    # model: "claude-3-haiku-20240307"
    # api_key: ""  # Set your Anthropic API key

    # LM Studio - Local LLM
    # model: "local-model"
    # api_base: "http://localhost:1234/v1"

    # Azure OpenAI
    # model: "azure/gpt-4"
    # api_key: ""
    # api_base: "https://your-resource.openai.azure.com/"
    # api_version: "2023-05-15"

# ============================================================================
# Quick Start Examples:
# ============================================================================
#
# 1. Use OpenAI (default):
#    provider: "openai"
#    Set environment: OPENAI_API_KEY=sk-...
#
# 2. Use Google Gemini (free tier available):
#    provider: "litellm"
#    model: "gemini/gemini-1.5-flash"
#    api_key: "YOUR_GEMINI_KEY"
#
# 3. Use Ollama (100% free, local):
#    - Install Ollama: https://ollama.com
#    - Run: ollama pull gemma2:2b
#    - Config:
#      provider: "litellm"
#      model: "ollama/gemma2:2b"
#      api_base: "http://localhost:11434"
#
# ============================================================================

