#ASR_MODEL: "Faster-Whisper"
ASR_MODEL: "FunASR"

FunASR:
  model_name: "iic/SenseVoiceSmall" # or "paraformer-zh" or "iic/SenseVoiceSmall" or "FunAudioLLM/Fun-ASR-Nano-2512"
  #vad_model: "fsmn-vad" # this is only used to make it works if audio is longer than 30s
  punc_model: "ct-punc" # punctuation model.
  # "mps" = Apple Silicon Metal. On an M4 this is ~5x faster than "cpu" and is
  # the difference between keeping up and falling behind: measured over one
  # 6.2s phrase in accumulate mode (10 calls), dual-track effective RTF is
  # 2.04 on cpu (falls behind 2x) versus 0.35 on mps.
  # Use "cpu" on Intel Macs / Windows without CUDA, "cuda" with an NVIDIA GPU.
  device: "mps"
  ncpu: 4 # number of threads for CPU internal operations (ignored on mps/cuda).
  hub: "ms" # ms (default) to download models from ModelScope. Use hf to download models from Hugging Face.
  use_itn: True
  # "auto", not a fixed language. SenseVoice detects zh/yue/en/ja/ko per
  # utterance, and pinning it mistranslates everything else: on a real
  # Cantonese call, language "en" turned 「哦，五三係嘛，請問你電話號碼幾多咧？」
  # into "o hi guess question." and 5.8s of speech into the single word
  # "some" -- the model forces the syllables onto English words.
  # Measured on that same audio, "auto" is also faster than pinning the
  # correct language (RTF 0.015 vs 0.025) and no less accurate.
  language: "auto" # zh, en, yue, ja, ko, auto

# ============================================================================
# LLM Configuration
# ============================================================================
# Supported providers: "openai" or "litellm"
# - openai: Uses OpenAI API (GPT-4, GPT-3.5)
# - litellm: Supports 100+ providers (Gemini, Ollama, Claude, etc.)
# ============================================================================

LLM:
  # Choose provider: "openai", "litellm" or "cli"
  provider: "openai"

  # ----------------------------------------------------------------------------
  # CLI Configuration -- answer through a locally installed agent CLI
  # ----------------------------------------------------------------------------
  # Bills against a subscription you may already pay for rather than per
  # token, so a long meeting costs nothing extra. The trade is latency: each
  # answer spawns a process, measured at 3.8-5.5s for `claude -p` against
  # roughly 1s for the same question over the API.
  #
  # Suited to the meeting-notes polish pass, where nobody is waiting. Not to
  # live interview prompting, where 4s plus transcription latency lands after
  # the moment has passed.
  #
  # The CLI must already be installed and logged in; there is no key to pass.
  cli:
    command: "claude"    # claude | codex | gemini
    # model: "opus"      # optional, passed as --model
    timeout: 90

  # ----------------------------------------------------------------------------
  # OpenAI Configuration
  # ----------------------------------------------------------------------------
  openai:
    model: "gpt-4o-mini"  # Options: gpt-4o-mini, gpt-4o, gpt-4-turbo, gpt-3.5-turbo
    # API key is loaded from environment variable OPENAI_API_KEY

  # ----------------------------------------------------------------------------
  # LiteLLM Configuration (supports multiple backends)
  # ----------------------------------------------------------------------------
  litellm:
    # Examples:

    # Google Gemini (Fast & Cheap)
    model: "gemini/gemini-1.5-flash"
    api_key: ""  # Set your Gemini API key here or use GEMINI_API_KEY env var

    # Google Gemini Pro (High Quality, 2M context)
    # model: "gemini/gemini-1.5-pro"
    # api_key: ""

    # Ollama - Local LLM (FREE, requires Ollama running)
    # model: "ollama/gemma2:2b"  # or llama3, qwen, etc.
    # api_base: "http://localhost:11434"

    # Claude (Anthropic)
    # model: "claude-3-haiku-20240307"
    # api_key: ""  # Set your Anthropic API key

    # LM Studio - Local LLM
    # model: "local-model"
    # api_base: "http://localhost:1234/v1"

    # Azure OpenAI
    # model: "azure/gpt-4"
    # api_key: ""
    # api_base: "https://your-resource.openai.azure.com/"
    # api_version: "2023-05-15"

# ============================================================================
# Quick Start Examples:
# ============================================================================
#
# 1. Use OpenAI (default):
#    provider: "openai"
#    Set environment: OPENAI_API_KEY=sk-...
#
# 2. Use Google Gemini (free tier available):
#    provider: "litellm"
#    model: "gemini/gemini-1.5-flash"
#    api_key: "YOUR_GEMINI_KEY"
#
# 3. Use Ollama (100% free, local):
#    - Install Ollama: https://ollama.com
#    - Run: ollama pull gemma2:2b
#    - Config:
#      provider: "litellm"
#      model: "ollama/gemma2:2b"
#      api_base: "http://localhost:11434"
#
# ============================================================================

