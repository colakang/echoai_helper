[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echoai-helper"
version = "1.4.6"
description = "Real-time meeting transcription and interview assistance, on-device"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
authors = [{ name = "colakang" }]
keywords = ["transcription", "asr", "meeting-notes", "diarization", "funasr"]

# 3.12 or 3.13. Not wider, and the reason is onnxruntime rather than anything
# here: it publishes no macOS arm64 wheel for 3.14, so the stack does not
# resolve there at all.
#
# 3.13 was excluded until now because the vendored src/custom_speech_recognition
# imports aifc and audioop, both removed from the standard library in 3.13.
# Two things make that surmountable. On macOS the module is never imported --
# verified at runtime, the capture path defers it and only the Windows backend
# reaches it. And where it is reached, the standard backports supply both,
# which is what the conditional dependencies below are for.

dependencies = [
    # Capture is platform-split. macOS records system output through a
    # virtual audio device via sounddevice; Windows uses WASAPI loopback,
    # which only PyAudioWPatch exposes and which has no macOS build at all.
    # Declaring both unconditionally would make the install fail on the
    # platform that cannot have the other.
    "sounddevice; sys_platform != 'win32'",
    "PyAudioWPatch; sys_platform == 'win32'",
    # Removed from the standard library in 3.13, and imported by the vendored
    # speech-recognition module that the Windows capture path uses. Installed
    # only where they are missing, so a 3.12 install carries neither.
    "audioop-lts; python_version >= '3.13'",
    "standard-aifc; python_version >= '3.13'",
    "numpy<2",                # funasr and torch still assume the 1.x ABI
    "scipy",
    "torch",
    "torchaudio",
    "funasr",
    "modelscope",
    "huggingface_hub",
    "loguru",                 # imported by src/asr/asr_with_vad.py
    "onnxruntime",            # silero VAD
    "soundfile",
    "openai",
    "customtkinter==5.1.3",
    "python-dotenv",
    "pyyaml",
    "pytz",
]

[project.optional-dependencies]
litellm = ["litellm"]         # Gemini, Ollama, Anthropic, ... via conf.yaml
dev = ["pytest"]

[project.scripts]
echoai-helper = "src.cli:main"

[project.urls]
Homepage = "https://github.com/colakang/echoai_helper"
Issues = "https://github.com/colakang/echoai_helper/issues"

[tool.setuptools]
# "scripts" is a package, not a directory of loose files: src/cli.py imports
# check_audio from it, so it has to resolve from site-packages and not merely
# from the current working directory of a checkout.
packages = ["src", "src.asr", "src.audio", "src.llm",
            "src.custom_speech_recognition", "scripts"]
include-package-data = true

[tool.setuptools.package-data]
# Everything the app reads at runtime lives inside the package. An installed
# wheel has no project root -- the code lands in site-packages, and there is
# nothing beside it to point at -- so conf.yaml and the prompt templates ship
# here or they are simply absent.
#
# The vendored pocketsphinx data and flac binaries are deliberately not listed:
# 42MB of a speech engine this app does not use.
"src" = ["conf.yaml", "resources/**/*"]
"src.asr" = ["models/*.onnx"]
