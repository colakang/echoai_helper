[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echoai-helper"
version = "1.2.0"
description = "Real-time meeting transcription and interview assistance, on-device"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "colakang" }]
keywords = ["transcription", "asr", "meeting-notes", "diarization", "funasr"]

# Pinned to 3.12 deliberately, not out of caution: the vendored
# src/custom_speech_recognition imports aifc and audioop at module level, and
# both were removed from the standard library in 3.13.

dependencies = [
    "sounddevice",
    "numpy<2",                # funasr and torch still assume the 1.x ABI
    "scipy",
    "torch",
    "torchaudio",
    "funasr",
    "modelscope",
    "huggingface_hub",
    "loguru",                 # imported by src/asr/asr_with_vad.py
    "onnxruntime",            # silero VAD
    "soundfile",
    "openai",
    "customtkinter==5.1.3",
    "python-dotenv",
    "pyyaml",
    "pytz",
]

[project.optional-dependencies]
litellm = ["litellm"]         # Gemini, Ollama, Anthropic, ... via conf.yaml
dev = ["pytest"]

[project.scripts]
echoai-helper = "src.cli:main"

[project.urls]
Homepage = "https://github.com/colakang/echoai_helper"
Issues = "https://github.com/colakang/echoai_helper/issues"

[tool.setuptools]
packages = ["src", "src.asr", "src.audio", "src.llm", "src.custom_speech_recognition"]
include-package-data = true

[tool.setuptools.package-data]
"src.asr" = ["models/*.onnx"]
